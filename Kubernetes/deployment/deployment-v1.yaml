apiVersion: apps/v1
kind: Deployment
metadata:
  name: aalu-backend
  labels:
    app: aalu-backend
    version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: aalu-backend
  template:
    metadata:
      labels:
        app: aalu-backend
        version: "1.0.0"
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine
          command: ["python3", "-c", "import http.server; http.server.test(HandlerClass=http.server.SimpleHTTPRequestHandler, port=8080)"]
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
              
